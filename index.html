<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Clap ! Ma carrière</title>
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--c:#fff;--ac:#c2410c;--mu:#6b675f;--bd:#ddd8cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--fg:#f1ece2;--c:#1f1c18;--ac:#fb923c;--mu:#a39d90;--bd:#38332b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--fg:#f1ece2;--c:#1f1c18;--ac:#fb923c;--mu:#a39d90;--bd:#38332b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#w{max-width:760px;margin:auto;padding:0 12px 40px}
#hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;font:13px system-ui,sans-serif;border-bottom:1px solid var(--bd);z-index:5}
.c{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 13px;margin:4px 4px 4px 0;font:600 14px system-ui,sans-serif;cursor:pointer}
.g{display:flex;flex-wrap:wrap}.r{display:flex;gap:12px;align-items:flex-start}.m,#lg{color:var(--mu);font:13px system-ui,sans-serif}
label{display:block;margin:8px 0;font:14px system-ui,sans-serif}label.i{display:inline-block;margin-right:10px}
input:not([type=checkbox]),select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
#lg{margin-top:20px;border-top:1px solid var(--bd);padding-top:8px}
</style></head><body><div id="w"><div id="hd"></div><main id="m"></main><div id="lg"></div></div>
<script>
const $=s=>document.querySelector(s),R=Math.random,rn=(a,b)=>Math.floor(a+R()*(b-a+1)),pk=a=>a[rn(0,a.length-1)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const E=n=>Math.abs(n)>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M€':Math.abs(n)>=1e3?Math.round(n/1e3)+' k€':Math.round(n)+' €';
const D=t=>new Date(Date.UTC(2026,9,24+t)).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
const iso=t=>new Date(Date.UTC(2026,9,24+t)).toISOString().slice(0,10),toT=s=>Math.round((Date.parse(s)-Date.UTC(2026,9,24))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,Q=[],view=()=>{};
const FN=['Léa','Hugo','Inès','Karim','Chloé','Marco','Sofia','Théo','Nadia','Paul','Yasmine','Louis','Camille','Omar','Jade'],LN=['Martin','Bernard','Dubois','Haddad','Rossi','Moreau','Lefèvre','Nguyen','Garcia','Petit','Roux','Diallo'];
const nm=()=>pk(FN)+' '+pk(LN),PF=['Nétflux','StreamMax','Disneo+','Canal Stream','Prime Vidéo'];
const BAD=/nazi|hitler|viol|pute|connard|merde|nègre|pédé|isis|zob|bite|salope|enculé/i;
const TP=['Les Heures Creuses','Nuit Blanche','Le Dernier Métro','Sous la Pluie','Mauvais Genre','La Ligne Rouge','Quartier Sud','Septembre','Les Invisibles','Écho'];
const TI=[['Court-métrage étudiant',0,[0,200],2],['Pub / clip local',8,[200,900],3],['Figuration série TV',15,[400,1200],3],['Second rôle film indé',28,[2000,9000],5],['Rôle principal film indé',45,[10000,40000],8],['Rôle dans une série à succès',60,[30000,120000],12],['Blockbuster',80,[200000,1500000],20]];
const SC=[['Le réalisateur te propose d’improviser ta scène.',[['Improviser à fond',()=>R()<.5?['Magique : toute l’équipe applaudit !',12,3]:['Ça part en vrille : 14 prises à refaire.',-8,-2]],['Coller au texte',()=>['Propre et efficace.',4,0]]]],
['Un fou rire général éclate en pleine prise.',[['Le garder pour les bonus',()=>['La scène devient culte dans l’équipe !',5,2]],['Recadrer tout le monde',()=>['Une heure perdue, mais la prise est nickel.',3,0]]]],
['Une star du plateau arrive en retard et dans un sale état.',[['La couvrir',()=>['Elle t’est reconnaissante : une alliée.',2,3]],['Prévenir la production',()=>R()<.5?['La prod apprécie ton sérieux.',3,2]:['Elle l’apprend et te boude.',-2,-4]],['En faire une story',()=>['Ça fait le buzz… et le scandale.',0,-3,1]]]],
['Une cascade dangereuse est prévue.',[['La faire toi-même',()=>R()<.55?['Bluffant ! Le plateau retient son souffle.',10,3]:['Aïe : deux jours d’arrêt.',-4,-1]],['Laisser la doublure',()=>['Sage décision.',2,0]]]]];
const DI=[['Une tempête force à arrêter le tournage.',[['Attendre 5 jours',{d:5}],['Louer un studio de secours (150 k€)',{c:15e4}],['Tourner quand même sous la pluie',{q:-6}]]],
['Le chef op et l’acteur principal se disputent.',[['Jouer les médiateurs',{q:2,d:1}],['Ignorer',{q:-3}],['Les séparer et recadrer',{d:2}]]],
['Un micro HF tombe en panne en pleine scène clé.',[['Refaire la prise',{d:1}],['Doubler en post-prod (80 k€)',{c:8e4}],['Garder le son pourri',{q:-5}]]],
['Le budget déraille sur les décors.',[['Rallonger de 500 k€',{c:5e5,q:1}],['Couper des scènes',{q:-5}]]],
['Un acteur improvise une réplique géniale.',[['Garder la prise',{q:5}],['Refaire proprement',{q:1,d:2}]]]];
const PR=[['TikTok',4e4,5],['Instagram',5e4,5],['Facebook',3e4,3],['Influenceurs',12e4,7],['Spot TV',3e5,11]];
const RL={mo:'Monteur·se',ca:'Cadreur·se / chef op',so:'Ingénieur·e du son'},ST={prep:'Pré-production',shoot:'Tournage',post:'Post-production',ready:'Prêt à sortir',out:'Sorti'};
const tg=v=>v>=78?'🔥 bluffant':v>=60?'👍 solide':v>=45?'😐 correct':'😬 inégal';
const age=()=>S.a0+Math.floor(S.t/365),fl=()=>Object.values(S.fol).reduce((a,b)=>a+b,0),gp=id=>S.pj.find(p=>p.id==id);
const rank=()=>S.fame<10?'inconnu·e':S.fame<30?'petit nom du circuit':S.fame<60?'visage qui monte':S.fame<85?'star':'légende';
function L(m){S.log.unshift(D(S.t)+' — '+m);S.log=S.log.slice(0,30)}
function save(){try{if(S)localStorage.setItem('clap',JSON.stringify({S,Q}))}catch(e){}}
function ld(){try{return JSON.parse(localStorage.getItem('clap'))}catch(e){return null}}
function draw(){$('#hd').innerHTML=S?`<b>${esc(S.name)}</b> · ${age()} ans · 📅 ${D(S.t)} · ⭐ Réput. ${Math.round(S.rep)} · 🔥 Célébrité ${Math.round(S.fame)} · ${S.mode=='d'?'🎥 Réalisateur · 💶 '+E(S.st):'🎭 Acteur · 💶 '+E(S.cash)}`:'';$('#lg').innerHTML=S?'<b>Journal</b><br>'+S.log.slice(0,6).join('<br>'):''}
function P(h){$('#m').innerHTML=h;draw();save();scrollTo(0,0)}
function go(f){view=f;f()}
function hub(){S.mode=='d'?hubD():hubA()}
function fol(n){for(const k in S.fol)S.fol[k]+=Math.round(n*R())}
function adv(n){for(let i=0;i<n;i++){S.t++;if(S.t%365==0)L('🎂 Joyeux anniversaire ! '+age()+' ans.');
for(const e of Q.filter(e=>e.t<=S.t)){Q.splice(Q.indexOf(e),1);const r=H[e.k](e);if(r){view=r;return true}}
for(const p of S.pj)if(p.sg!='out'&&S.t>p.rel&&!p.warn){p.warn=1;S.rep=Math.max(0,S.rep-3);L(`⚠️ « ${p.ti} » n’est pas prête à la date annoncée : la presse s’interroge (réputation -3). Pense à annoncer un report !`)}}return false}
const wait=()=>adv(7)?view():go(hub);

function create(){P(`<h1>🎬 Clap ! Ma carrière</h1><p>Début de partie : 24 octobre 2026. Crée ton personnage de A à Z.</p><div class="c">`+[['n','Prénom et nom'],['ph','Physique (taille, cheveux, signe distinctif…)'],['or','Origine et ville de départ'],['pa','Passé / histoire'],['pe','Personnalité (3 à 5 traits)'],['df','Défaut majeur'],['rv','Ton rêve (Oscar, Palme d’Or…)']].map(([i,l])=>`<label>${l}<input id="${i}"></label>`).join('')+`<label>Âge de départ (18-60)<input id="ag" type="number" min="18" max="60" value="22"></label><label>Genre / pronoms<input id="ge"></label><fieldset><legend>Talents</legend>`+['Drame','Comédie','Action / cascades','Voix','Chant','Langues','Improvisation'].map(t=>`<label class="i"><input type="checkbox" class="tl" value="${t}"> ${t}</label>`).join('')+`</fieldset><label>Ta voie<select id="vo"><option value="a">🎭 Acteur</option><option value="d">🎥 Réalisateur (20 M€ de budget)</option><option value="b">🔄 Acteur, puis réalisateur quand je veux</option></select></label><button class="b" onclick="start()">▶ Lancer la partie</button></div>`)}
function start(){const g=i=>$('#'+i).value.trim(),tl=[...document.querySelectorAll('.tl:checked')].map(x=>x.value);if(!g('n')){alert('Donne un nom à ton personnage');return}
const vo=g('vo');S={name:g('n'),ph:g('ph'),or:g('or'),pa:g('pa'),pe:g('pe'),df:g('df'),rv:g('rv'),ge:g('ge'),a0:cl(+g('ag')||22,18,60),tl,skill:35+Math.min(tl.length,6)*4+rn(0,10),t:0,rep:5,fame:0,cash:vo=='d'?5000:1500,st:vo=='d'?2e7:0,op:vo=='d',vo,mode:vo=='d'?'d':'a',fol:{TikTok:0,Instagram:0,Facebook:0},roles:[],film:[],pj:[],cs:null,log:[],u:0};Q=[];L('La partie commence. Tout reste à prouver…');go(hub)}
function sw(){if(S.mode=='a'){if(!S.op){S.op=1;S.st=2e7;L('🎥 Tu fondes ton studio avec 20 M€ de budget !')}S.mode='d'}else S.mode='a';go(hub)}

/* ACTEUR */
function hubA(){P(`<h2>🎭 Ta vie d’acteur</h2><p class="m">${esc(S.name)} — ${rank()}. ${S.rv?'Rêve : '+esc(S.rv):''}</p><div class="g"><button class="b" onclick="go(cast)">🎟️ Castings</button><button class="b" onclick="go(soc)">📱 Réseaux sociaux</button><button class="b" onclick="go(fil)">🎞️ Filmographie</button>${S.fame>=35?'<button class="b" onclick="go(med)">🎤 Médias & événements</button>':''}<button class="b" onclick="wait()">⏳ Laisser passer 1 semaine</button>${S.vo!='a'?'<button class="b" onclick="sw()">🎥 Passer derrière la caméra</button>':''}</div>`)}
const chance=i=>cl(.3+S.fame/220-i*.1+(S.skill-40)/400+Math.min(.1,fl()/2e5)+S.rep/500,.04,.8);
function gc(){const ok=TI.map((x,i)=>i).filter(i=>TI[i][1]<=S.fame);S.cs=[0,1,2].map(j=>{const i=j?pk(ok):0;return{i,ti:pk(TP),pay:rn(...TI[i][2])}})}
function cast(){if(!S.cs||!S.cs.length)gc();P(`<h2>🎟️ Castings</h2><p class="m">Les chances dépendent de ta célébrité, ton talent, ta réputation et tes abonnés. Au début, c’est dur.</p>`+S.cs.map((o,i)=>`<div class="c"><b>${o.ti}</b><br>${TI[o.i][0]} · cachet ~${E(o.pay)}<br>Chances : ${Math.round(chance(o.i)*100)}%<br><button class="b" onclick="aud(${i})">Passer le casting (2 j)</button></div>`).join('')+`<button class="b" onclick="S.cs=null;adv(7)?view():go(cast)">🔄 Chercher d’autres annonces (7 j)</button><button class="b" onclick="go(hub)">← Retour</button>`)}
function aud(i){const o=S.cs.splice(i,1)[0],ok=R()<chance(o.i);let h;
if(ok){const r={id:++S.u,t:o.ti,i:o.i,perf:0};S.roles.push(r);Q.push({t:S.t+rn(7,12),k:'shootA',id:r.id},{t:S.t+rn(50,90),k:'relA',id:r.id});S.rep+=1;L(`🎉 Rôle décroché : « ${o.ti} » (${TI[o.i][0]}).`);h=`<h2>🎉 Tu es pris·e !</h2><p>Tu décroches « ${o.ti} ». Le tournage commence dans environ une semaine.</p>`}
else{S.rep+=.2;L(`Casting raté pour « ${o.ti} ».`);h=`<h2>😔 Refusé·e</h2><p>${pk(['« On a pris quelqu’un d’autre. »','« Trop timide devant la caméra. »','« On vous rappellera. » (non)','« Pas le bon profil. »'])}</p>`}
adv(2)?view():P(h+'<button class="b" onclick="go(cast)">Continuer</button>')}
function sa(id,s,j){const r=S.roles.find(x=>x.id==id),x=SC[s][1][j][1]();r.perf+=x[1];S.rep=cl(S.rep+x[2],0,100);if(x[3])fol(2500);L(`Plateau de « ${r.t} » : ${x[0]}`);P(`<div class="c">${x[0]}</div><button class="b" onclick="go(hub)">Fin de journée →</button>`)}
function soc(){P(`<h2>📱 Réseaux sociaux</h2><div class="c">${Object.entries(S.fol).map(([k,v])=>`${k} : <b>${v.toLocaleString('fr-FR')}</b>`).join('<br>')}</div><label>Réseau<select id="nt">${Object.keys(S.fol).map(k=>`<option>${k}</option>`).join('')}</select></label>${['📸 Selfie','🎥 Coulisses du plateau','😂 Vidéo drôle','🔥 Coup de gueule'].map((t,i)=>`<button class="b" onclick="post(${i})">${t}</button>`).join('')}<br><button class="b" onclick="go(hub)">← Retour</button>`)}
function post(k){const n=$('#nt').value;let g=Math.round(rn(5,60)*(1+S.fame/8)*(k==2?1.6:1)),t='Ton post performe correctement.';if(k==3&&R()<.45){g=Math.round(g*.3);S.rep=Math.max(0,S.rep-2);t='Bad buzz : ton coup de gueule se retourne contre toi (réputation -2).'}S.fol[n]+=g;S.rep+=.2;L(`Post sur ${n} : +${g} abonnés.`);adv(1)?view():P(`<div class="c">${t}<br>+${g} abonnés sur ${n}.</div><button class="b" onclick="go(soc)">Continuer</button>`)}
function fil(){P(`<h2>🎞️ Filmographie</h2>`+(S.film.length?S.film.map((f,i)=>`<div class="c"><b>${f.t}</b> · ${f.k}<br>Note presse : ${f.rating}/100 · ${f.ent?'Entrées : '+f.ent.toLocaleString('fr-FR')+' · ':''}dispo sur <b>${f.pf}</b><br><button class="b" onclick="watch(${i})">▶ Voir sur ${f.pf}</button></div>`).join(''):'<p class="m">Aucun film sorti pour l’instant.</p>')+`<button class="b" onclick="go(hub)">← Retour</button>`)}
function watch(i){const f=S.film[i];adv(1)?view():P(`<div class="c">Tu lances « ${f.t} » sur ${f.pf}. ${pk(['Te voir à l’écran est étrange.','Tu repères ton erreur de raccord, personne d’autre ne la verra.','Tu revis le fou rire du plateau.'])}</div><button class="b" onclick="go(fil)">Retour</button>`)}
function med(){P(`<h2>🎤 Médias & événements</h2><button class="b" onclick="itw()">Interview</button>${S.fame>=50?'<button class="b" onclick="prem()">Avant-première</button>':''}<button class="b" onclick="avis()">Donner mon avis sur un film</button><br><button class="b" onclick="go(hub)">← Retour</button>`)}
function eff(t,r,f){S.rep=cl(S.rep+r,0,100);if(f)fol(f);L(t);adv(1)?view():P(`<div class="c">${t}</div><button class="b" onclick="go(hub)">Continuer</button>`)}
function itw(){P(`<div class="c">Le journaliste : « Alors, que dites-vous à ceux qui vous trouvent surcoté·e ? »</div><button class="b" onclick="eff('Réponse sincère : le public apprécie.',2,500)">Rester sincère</button><button class="b" onclick="R()<.5?eff('Ta punchline fait le tour des réseaux !',1,4000):eff('Ta provocation passe mal (réput. -3).',-3,300)">Provoquer</button><button class="b" onclick="eff('Humble et charmant·e.',1,300)">Rester humble</button>`)}
function prem(){S.fame=Math.min(100,S.fame+1.5);eff('Tapis rouge, flashs, photos : ta célébrité grimpe.',1,3000)}
function avis(){const t=pk(['Les Cendres du Roi','Minuit à Marseille','Le Grand Détour']);P(`<div class="c">On te demande ton avis sur « ${t} ».</div><button class="b" onclick="eff('Avis honnête : les cinéphiles respectent.',1,300)">Honnête</button><button class="b" onclick="eff('Tu étrilles le film : buzz, mais l’équipe du film t’en veut.',-2,2500)">Le descendre</button><button class="b" onclick="eff('Tout le monde adore, personne ne te croit vraiment.',.5,200)">Tout encenser</button>`)}

/* ÉVÉNEMENTS */
const reg=q=>q>=75?pk(['« OK là c’est un CHEF-D’ŒUVRE les gars, courez-y !! 🔥 »','« J’ai pleuré, j’ai ri, j’ai remis mon pouce en l’air. »']):q>=50?'« Pas mal du tout, quelques longueurs mais j’ai kiffé. »':q>=30?'« Bof… j’ai checké mon téléphone 12 fois. »':'« Les gars… non. Juste non. 💀 »';
const H={
shootA(e){const r=S.roles.find(x=>x.id==e.id);r.pay=rn(...TI[r.i][2]);S.cash+=r.pay;const s=rn(0,SC.length-1);return()=>P(`<h2>🎬 Sur le plateau — « ${r.t} »</h2><p>Jour de tournage, tu es dans le studio. Cachet reçu : ${E(r.pay)}.</p><div class="c">${SC[s][0]}</div>`+SC[s][1].map((c,j)=>`<button class="b" onclick="sa(${r.id},${s},${j})">${c[0]}</button>`).join(''))},
relA(e){const r=S.roles.find(x=>x.id==e.id),rating=cl(Math.round(30+S.skill*.3+r.perf*1.5+TI[r.i][3]+rn(-10,25)),10,98),ent=r.i>=3?Math.round(TI[r.i][3]*30000*rating/50*(.5+R())):0;
S.fame=Math.min(100,S.fame+TI[r.i][3]*rating/50);S.rep=cl(S.rep+(rating>60?3:-1),0,100);S.film.push({t:r.t,k:TI[r.i][0],rating,ent,pf:pk(PF)});L(`🎞️ « ${r.t} » sort : ${rating}/100.`);
return()=>P(`<h2>🎞️ Sortie de « ${r.t} »</h2><div class="c">Note de la presse : <b>${rating}/100</b>${ent?'<br>Entrées : <b>'+ent.toLocaleString('fr-FR')+'</b>':''}</div><div class="c">📱 Regelegoria : ${reg(rating)}</div><button class="b" onclick="go(fil)">Voir ma filmographie</button><button class="b" onclick="go(hub)">Continuer</button>`)},
box(e){const p=gp(e.id),n=Math.round(p.E*e.s*p.mult);p.ent+=n;p.rev+=n*7;S.st+=n*7;L(`« ${p.ti} » : ${p.ent.toLocaleString('fr-FR')} entrées.`);if(e.s==.2)return()=>P(`<h2>📊 Bilan en salles — « ${p.ti} »</h2><div class="c"><b>${p.ent.toLocaleString('fr-FR')}</b> entrées · recettes ${E(p.rev)}<br>Budget : ${E(p.b)}<br>${p.rev>=p.b?'✅ Rentable !':'❌ Déficitaire en salles : les plateformes pourraient te sauver.'}</div><button class="b" onclick="pp(${p.id})">Voir le projet</button>`)},
reg(e){const p=gp(e.id);p.mult=p.qf>=75?1.25:p.qf<35?.8:1;fol(p.qf>=75?20000:2000);return()=>P(`<h2>📱 Regelegoria a réagi à « ${p.ti} »</h2><div class="c">${reg(p.qf)}</div><p class="m">Sa vidéo sur TikTok et Instagram ${p.mult>1?'fait exploser':p.mult<1?'plombe':'influence un peu'} le bouche-à-oreille.</p><button class="b" onclick="pp(${p.id})">Continuer</button>`)},
crit(e){const p=gp(e.id),os=['Le Monde du Ciné','Télé-Plaisir','Cahiers du Cinéma','CinéCritik'].sort(()=>R()-.5).slice(0,3),rv=os.map((o,i)=>{const s=cl(Math.round((p.qf/20+(R()-.5)*1.6)*2)/2,.5,5),t=i==0&&p.bad?'« Un titre qui sent le malaise, et ça ne s’arrange pas ensuite. »':s>=4?pk(['« Un souffle rare, une mise en scène habitée. »','« Bluffant : on en sort groggy et ravi. »']):s>=2.5?pk(['« Honnête, mais sans surprise. »','« Des idées, des longueurs. Un coup d’essai plausible. »']):pk(['« Interminable. On cherche la sortie. »','« Un projet qui se prend les pieds dans le tapis. »']);return{o,s:p.bad&&i==0?Math.min(s,1.5):s,t}});
p.rate=(rv.reduce((a,x)=>a+x.s,0)/3).toFixed(1);S.rep=cl(S.rep+(p.rate-2.5)*2-(p.bad?3:0),0,100);L(`Critiques de « ${p.ti} » : ${p.rate}/5.`);
return()=>P(`<h2>📰 Les critiques sont tombées — « ${p.ti} »</h2>`+rv.map(x=>`<div class="c"><b>${x.o}</b> · ${'★'.repeat(Math.floor(x.s))}${x.s%1?'½':''} (${x.s}/5)<br>${x.t}</div>`).join('')+`<p>Moyenne : <b>${p.rate}/5</b></p><button class="b" onclick="pp(${p.id})">Continuer</button>`)},
offer(e){const p=gp(e.id);if(p.plat||!mkOf(p))return;return()=>ofV(p.id)}};

/* RÉALISATEUR */
function poster(p,w){const d=(p.desc||'').toLowerCase(),v=d.length<25,m=r=>r.test(d);

if(m(/homme|femme|héros|héroïne|personnage|silhouette|fille|garçon|enfant/))g+='<circle cx="100" cy="150" r="14" fill="#000"/><path d="M70 235 Q100 150 130 235Z" fill="#000"/>'}
const t=p.ti.toUpperCase(),fs=Math.max(12,Math.min(30,230/Math.max(5,t.length)*1.6));
return `<svg viewBox="0 0 200 300" width="${w}" style="border-radius:6px;flex:none"><defs><linearGradient id="g${p.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="200" height="300" fill="url(#g${p.id})"/>${g}<text x="100" y="60" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="${fs}" font-weight="bold">${esc(t)}</text><text x="100" y="285" text-anchor="middle" fill="#fff" opacity=".8" font-size="10" font-family="sans-serif">${v?'affiche bâclée…':p.ty=='s'?'SÉRIE · SAISON '+p.se:'UN FILM DE '+esc(S.name.toUpperCase())}</text></svg>`}
function hubD(){P(`<h2>🎥 Ton studio</h2><p class="m">Trésorerie : <b>${E(S.st)}</b></p><div class="g"><button class="b" onclick="np()">➕ Nouveau film / série</button><button class="b" onclick="wait()">⏳ 1 semaine</button>${S.vo=='b'?'<button class="b" onclick="sw()">🎭 Redevenir acteur</button>':''}</div>`+S.pj.map(p=>`<div class="c" onclick="pp(${p.id})" style="cursor:pointer"><div class="r">${poster(p,70)}<div><b>${esc(p.ti)}</b> ${p.ty=='s'?'(saison '+p.se+')':''}<br>${ST[p.sg]} · sortie ${D(p.rel)}${p.sg=='out'?`<br>${p.ent.toLocaleString('fr-FR')} ${p.ty=='s'?'spectateurs':'entrées'} · ${E(p.rev)}`:''}</div></div></div>`).join(''))}
function np(se,pid){const o=pid?gp(pid):null;P(`<h2>${o?'📺 Saison '+se+' de « '+esc(o.ti)+' »':'➕ Nouveau projet'}</h2><div class="c"><label>Titre (attention aux titres douteux…)<input id="ti" value="${o?esc(o.ti):''}"></label><label>Type<select id="ty" ${o?'disabled':''} onchange="tyc()"><option value="f">🎬 Film</option><option value="s" ${o?'selected':''}>📺 Série</option></select></label><label>Date de sortie provisoire<input id="rd" type="date" value="${iso(S.t+120)}" min="${iso(S.t+31)}"></label><label>Budget (M€, max ${(S.st/1e6).toFixed(1)})<input id="bu" type="number" step="0.5" value="${Math.min(20,Math.floor(S.st/1e6))}"></label><label>Description de l’affiche (plus tu es précis·e, mieux c’est : couleurs, décor, personnages, ambiance…)<textarea id="de" rows="4"></textarea></label><button class="b" onclick="mk(${se||1},${o?o.hype*.7:0})">Créer le projet</button><button class="b" onclick="go(hub)">Annuler</button></div>`);tyc()}
function mk(se,hy){const ti=$('#ti').value.trim(),ty=$('#ty').value,rel=toT($('#rd').value),b=+$('#bu').value*1e6;
if(!ti||!(b>=5e5)||b>S.st||!(rel>S.t+30)){alert('Vérifie : titre, budget (0,5 M€ minimum, ≤ trésorerie) et date (dans plus de 30 jours).');return}
S.st-=b;const cd=()=>Array.from({length:3},()=>({n:nm(),s:rn(30,92)})),p={id:++S.u,ti,ty,se,rel,b,sp:0,desc:$('#de').value.trim(),sg:'prep',cr:{},cd:{mo:cd(),ca:cd(),so:cd()},cc:cd().map(c=>({n:c.n,t:c.s})),cast:null,hype:hy||cl(8+S.rep/4,0,60),q:0,mult:1,ent:0,rev:0,bad:BAD.test(ti)};
S.pj.unshift(p);L(`Nouveau projet : « ${ti} » (${ty=='s'?'série':'film'}, budget ${E(b)}).`);pp(p.id)}
function pp(id){const p=gp(id);view=()=>pp(id);const rm=p.b-p.sp;
let h=`<button class="b" onclick="go(hub)">←</button><h2>${p.ty=='s'?'📺':'🎬'} ${esc(p.ti)}${p.ty=='s'?' — Saison '+p.se:''}</h2><div class="r">${poster(p,150)}<div>État : <b>${ST[p.sg]}</b><br>Sortie prévue : <b>${D(p.rel)}</b><br>Budget restant : ${E(rm)} / ${E(p.b)}<br>Buzz : ${Math.round(p.hype)}/100${p.bad?'<br>⚠️ Ce titre risque de faire des vagues…':''}${p.sg=='out'?`<br>${p.ty=='s'?'Spectateurs':'Entrées'} : <b>${p.ent.toLocaleString('fr-FR')}</b><br>Recettes : ${E(p.rev)}${p.rate?'<br>Presse : '+p.rate+'/5':''}${p.plat?'<br>Plateforme : '+p.plat+' ('+E(p.sold)+')':''}`:''}</div></div>`;
if(p.sg!='out')h+=`<div class="c"><b>🖼️ Affiche</b> (autant d’essais que tu veux)<textarea id="de" rows="3">${esc(p.desc)}</textarea><button class="b" onclick="gen(${id})">Générer l’affiche</button></div>`;
if(p.sg=='prep'){for(const r in RL)h+=`<div class="c"><b>${RL[r]}</b> `+(p.cr[r]?'✅ '+p.cr[r].n:p.cd[r].map((c,i)=>`<br><button class="b" onclick="hi(${id},'${r}',${i})">Embaucher ${c.n} · ${tg(c.s)} · ${E(c.s*2500)}</button>`).join(''))+'</div>';
h+=`<div class="c"><b>Casting (rôle principal)</b> `+(p.cast?'✅ '+p.cast.n:p.cc.map((c,i)=>`<br><button class="b" onclick="ca(${id},${i})">Retenir ${c.n} · ${tg(c.t)} · ${E(c.t*7000)}</button>`).join(''))+'</div>';
if(p.cast&&p.cr.mo&&p.cr.ca&&p.cr.so)h+=`<button class="b" onclick="sh(${id})">🎬 Lancer le tournage</button>`}
if(p.sg=='shoot')h+=`<div class="c">Tournage en cours : étape ${p.bt+1}/3.</div><button class="b" onclick="beat(${id})">🎬 Aller sur le plateau (10 j)</button><button class="b" onclick="rush(${id})">👀 Voir les rushes</button>`;
if(p.sg=='post')h+=`<button class="b" onclick="p=gp(${id});p.sg='ready';adv(20)?view():pp(${id})">✂️ Lancer le montage (20 j)</button>`;
if(p.sg=='ready')h+=`<div class="c"><button class="b" onclick="vis(${id})">👁️ Visionner mon montage</button><br><label>Annoncer un report à la presse<input id="nd" type="date" value="${iso(p.rel+30)}"></label><button class="b" onclick="rep(${id})">📰 Reporter la sortie</button></div><button class="b" onclick="so(${id})">🚀 ${p.ty=='s'?'Mettre en ligne':'Sortir en salles'}</button>`;
if(p.sg!='out'&&p.sg!='prep'||p.sg=='prep')h+=`<div class="c"><b>📣 Promotion</b> (autant que tu veux)<br>`+PR.map((x,i)=>`<button class="b" onclick="pr(${id},${i})">${x[0]} · ${E(x[1])}</button>`).join('')+'</div>';
if(p.sg=='out'){h+=`<div class="g"><button class="b" onclick="wp(${id})">▶ ${p.ty=='s'?'Voir un épisode':'Voir mon film'}</button>${p.plat?'':`<button class="b" onclick="ct(${id})">🤝 Contacter les plateformes (7 j)</button>`}${p.ty=='s'?`<button class="b" onclick="np(${p.se+1},${id})">📺 Lancer la saison ${p.se+1}</button>`:''}</div>`;if(p.of)h+=`<button class="b" onclick="ofV(${id})">📨 Offre de ${p.of.pf} en attente</button>`}
P(h)}
function gen(id){const p=gp(id);p.desc=$('#de').value.trim();pp(id)}
function hi(id,r,i){const p=gp(id),c=p.cd[r][i],f=c.s*2500;if(p.sp+f>p.b){alert('Budget insuffisant');return}p.sp+=f;p.cr[r]=c;L(`${c.n} embauché·e (${RL[r]}).`);pp(id)}
function ca(id,i){const p=gp(id),c=p.cc[i],f=c.t*7000;if(p.sp+f>p.b){alert('Budget insuffisant');return}p.sp+=f;p.cast=c;L(`${c.n} décroche le rôle principal de « ${p.ti} ».`);pp(id)}
function sh(id){const p=gp(id);p.sg='shoot';p.bt=0;L(`🎬 Début du tournage de « ${p.ti} ».`);pp(id)}
function beat(id){const p=gp(id),i=rn(0,DI.length-1),d=DI[i];P(`<h2>🎬 Sur ton plateau — « ${esc(p.ti)} »</h2><div class="c">${d[0]}</div>`+d[1].map((c,j)=>`<button class="b" onclick="bt(${id},${i},${j})">${c[0]}</button>`).join(''))}
function bt(id,i,j){const p=gp(id),c=DI[i][1][j][1];p.q+=c.q||0;if(c.c)S.st-=c.c;p.bt++;if(p.bt>=3)p.sg='post';L(`Tournage de « ${p.ti} » : ${DI[i][0]} → ${DI[i][1][j][0]}.`);adv(10+(c.d||0))?view():pp(id)}
function rush(id){const p=gp(id);P(`<div class="c">Dans les rushes : ${pk(['une prise sublime sous la lumière du soir.','un acteur qui fixe la caméra par erreur.','un plan-séquence audacieux de ton chef op.','un perchman visible dans le champ… à couper.'])}</div><button class="b" onclick="pp(${id})">Retour</button>`)}
function vis(id){const p=gp(id),e=p.q+rn(-15,15);P(`<div class="c">Tu visionnes ton montage. ${e>8?'Ça tient vraiment la route !':e>-8?'Correct, avec des hauts et des bas.':'Il y a de sérieux problèmes de rythme…'}</div><button class="b" onclick="pp(${id})">Retour</button>`)}
function rep(id){const p=gp(id),d=toT($('#nd').value);if(!(d>S.t)){alert('Date invalide');return}p.rel=d;p.warn=0;p.hype=Math.max(0,p.hype-4);L(`📰 Tu annonces un report : « ${p.ti} » sortira le ${D(d)}.`);pp(id)}
function pr(id,i){const p=gp(id),x=PR[i];if(x[1]>S.st){alert('Trésorerie insuffisante');return}S.st-=x[1];p.hype+=x[2]*(1-p.hype/130);L(`Pub ${x[0]} pour « ${p.ti} ».`);adv(1)?view():pp(id)}
function so(id){const p=gp(id),av=a=>a.reduce((x,y)=>x+y,0)/a.length;
p.qf=cl(.25*p.cast.t+.25*av(Object.values(p.cr).map(c=>c.s))+.2*Math.min(100,p.b/(p.tot||110)/2500)+.15*Math.min(100,p.desc.length/2.2)+.15*rn(20,90)+p.q-(p.bad?18:0),5,98);
p.sg='out';S.st+=Math.max(0,p.b-p.sp);const e=p.ty=='s'?(p.hype*4e4+2e5)*(p.qf/55)*(.7+R()*.6):(15e4+p.hype*38e3)*Math.pow(p.qf/55,2)*(.7+R()*.8);p.E=Math.round(e);
if(p.ty=='f'){p.ent=0;[[7,.5],[14,.3],[28,.2]].forEach(([d,s])=>Q.push({t:S.t+d,k:'box',id,s}))}else p.ent=p.E;
Q.push({t:S.t+2,k:'reg',id},{t:S.t+3,k:'crit',id},{t:S.t+rn(6,14),k:'offer',id});L(`🚀 « ${p.ti} » est sorti${p.ty=='s'?'e':''} !`);
P(`<h2>🚀 C’est sorti !</h2><div class="c">« ${esc(p.ti)} » est en ${p.ty=='s'?'ligne':'salles'}. ${p.ty=='f'?'Premiers chiffres d’entrées dans une semaine.':'Premiers chiffres d’audience : '+p.ent.toLocaleString('fr-FR')+' spectateurs.'}<br>Regelegoria va donner son avis, la presse aussi…</div><button class="b" onclick="pp(${id})">Voir le projet</button>`)}
function wp(id){const p=gp(id);adv(1)?view():P(`<div class="c">${p.ty=='s'?'Tu regardes « '+pk(p.eps||[{t:'un épisode'}]).t+' »':'Tu retournes voir ton film ('+(p.tot||110)+' min)'} avec le public. ${p.qf>65?'La salle réagit exactement comme tu l’espérais.':p.qf>40?'Quelques rires aux bons moments, quelques bâillements aux autres.':'Tu entends des gens soupirer…'}</div><button class="b" onclick="pp(${id})">Retour</button>`)}
function mkOf(p){if(p.qf<30&&R()<.6)return false;p.of={pf:pk(PF),pr:Math.round(p.b*(.25+p.qf/100*.9)*(.8+R()*.5)/1e4)*1e4,n:0};return true}
function ct(id){const p=gp(id);const ok=mkOf(p);adv(7)?view():ok?ofV(id):P(`<div class="c">Aucune plateforme n’est intéressée pour l’instant.</div><button class="b" onclick="pp(${id})">Retour</button>`)}
function ofV(id,msg){const p=gp(id),o=p.of;if(!o){pp(id);return}P(`<h2>🤝 ${o.pf} veut « ${esc(p.ti)} »</h2><div class="c">${msg||'Ils te proposent'} <b>${E(o.pr)}</b>.</div><button class="b" onclick="oa(${id},'y')">✅ Accepter</button>${o.n?'':`<button class="b" onclick="oa(${id},'n')">💬 Négocier</button>`}<button class="b" onclick="oa(${id},'x')">❌ Refuser</button>`)}
function oa(id,a){const p=gp(id),o=p.of;if(a=='y'){S.st+=o.pr;p.rev+=o.pr;p.plat=o.pf;p.sold=o.pr;p.of=null;L(`💶 « ${p.ti} » vendu à ${o.pf} pour ${E(o.pr)}.`);pp(id)}
else if(a=='x'){p.of=null;L(`Tu refuses l’offre de ${o.pf}.`);pp(id)}
else{o.n=1;const r=R();if(r<.5){o.pr=Math.round(o.pr*1.3/1e4)*1e4;ofV(id,'Ils remontent leur offre à')}else if(r<.8)ofV(id,'Ils maintiennent leur offre à')
else{p.of=null;L(`${o.pf} retire son offre.`);P(`<div class="c">${o.pf} perd patience et retire son offre…</div><button class="b" onclick="pp(${id})">Retour</button>`)}}}

const sv=null;if(sv&&sv.S){P(`<h1>🎬 Clap !</h1><button class="b" onclick="S=sv.S;Q=sv.Q;go(hub)">▶ Continuer ma carrière (${esc(sv.S.name)})</button><button class="b" onclick="create()">Nouvelle partie</button>`)}else create();

function chk(p){const o=[],t=nz(p.ti),sy=nz((p.sy||'')+' '+(p.th||'')),ch=nz(p.ch);

H.suit=e=>{const p=gp(e.id),c=p.cl&&p.cl[0];if(!c||p.sued)return;p.sued=1;p.amt=Math.round(p.b*(.08+R()*.15)/1e4)*1e4;NW(`${c.st} porte plainte contre « ${p.ti} » (${c.k}).`);

else if(R()<.5){S.rep=Math.min(100,S.rep+3);t='Tu gagnes au tribunal ! La presse salue ton audace.';NW(`Plainte contre « ${p.ti} » rejetée.`)}else{S.st-=p.amt*2;S.rep=Math.max(0,S.rep-8);p.rel+=30;p.warn=0;t='Procès perdu : dommages doublés, sortie repoussée de 30 jours, mauvaise presse.';NW(`Procès perdu pour « ${p.ti} ».`)}

function np(se,pid){busy=true;const o=pid?gp(pid):null;PE=o&&o.eps?o.eps:null;P(`<h2>${o?'📺 Saison '+se+' de « '+esc(o.ti)+' »':'➕ Nouveau projet'}</h2><div class="c"><label>Titre (un titre existant = risque de plainte)<input id="ti" value="${o?esc(o.ti):''}"></label><label>Type<select id="ty" ${o?'disabled':''} onchange="tyc()"><option value="f">🎬 Film</option><option value="s" ${o?'selected':''}>📺 Série</option></select></label><div id="fb"><label>Durée du film (minutes)<input id="du" type="number" min="5" max="300" value="110" onchange="upd()"></label></div><div id="sb" style="display:none"><label>Nombre d’épisodes<input id="ne" type="number" min="1" max="30" value="8" onchange="epl()"></label><label>Durée par défaut d’un épisode (min)<input id="edf" type="number" min="5" max="120" value="50" onchange="epl(1)"></label><div id="eps"></div></div><p class="m" id="hn"></p><label>Genre<select id="gn">${GN.map(x=>`<option ${o&&o.gn==x?'selected':''}>${x}</option>`).join('')}</select></label><label>Thème (libre, ce que tu veux)<input id="th" value="${o?esc(o.th):''}"></label><label>Synopsis<textarea id="sy" rows="3">${o?esc(o.sy):''}</textarea></label><label>Noms des personnages principaux<input id="ch" value="${o?esc(o.ch):''}"></label><label>Date de sortie provisoire<input id="rd" type="date" value="${iso(S.t+150)}" min="${iso(S.t+31)}"></label><label>Budget (M€, max ${(S.st/1e6).toFixed(1)})<input id="bu" type="number" step="0.5" value="${Math.max(1,Math.min(20,Math.floor(S.st/1e6)))}"></label><label>Description de l’affiche (plus tu es précis·e, mieux c’est)<textarea id="de" rows="4"></textarea></label><button class="b" onclick="mk(${se||1},${o?o.hype*.7:0})">Créer</button><button class="b" onclick="go(hub)">Annuler</button></div>`)}
function mk(se,hy){const ti=$('#ti').value.trim(),ty=$('#ty').value,rel=toT($('#rd').value),b=+$('#bu').value*1e6;
let eps=[];if(ty=='s'){const n=cl(+$('#ne').value||1,1,30);for(let i=0;i<n;i++)eps.push({t:(($('#et'+i)||{value:''}).value.trim())||'Épisode '+(i+1),d:cl(+(($('#ed'+i)||{value:50}).value)||50,5,120)})}else eps=[{t:ti,d:cl(+$('#du').value||110,5,300)}];const tot=eps.reduce((a,x)=>a+x.d,0);
if(!ti||!(b>=5e5)||b>S.st||!(rel>S.t+Math.round(est(tot)*.7))){alert('Vérifie : titre, budget (0,5 M€ min, ≤ trésorerie) et date. Pour '+tot+' min, il faut compter environ '+est(tot)+' jours de production.');return}
S.st-=b;const cd=()=>Array.from({length:3},()=>({n:nm(),s:rn(30,92)})),p={id:++S.u,ti,ty,se,rel,b,sp:0,gn:$('#gn').value,th:$('#th').value.trim(),sy:$('#sy').value,ch:$('#ch').value,desc:$('#de').value.trim(),sg:'prep',cr:{},cd:{mo:cd(),ca:cd(),so:cd()},cc:cd().map(c=>({n:c.n,t:c.s})),cast:null,hype:hy||cl(8+S.rep/4+S.pop/3,0,70),q:0,mult:1,ent:0,rev:0,bad:BAD.test(ti),cal:[],done:0,eps,tot,need:Math.max(3,Math.ceil(tot/20))};
p.cl=chk(p);if(p.cl.length)Q.push({t:S.t+rn(5,25),k:'suit',id:p.id});S.pj.unshift(p);L(`Nouveau projet : « ${ti} » (${p.gn}).`);NW(`Annonce : « ${ti} », ${p.ty=='s'?'série':'film'} ${p.gn.toLowerCase()}.`);pp(p.id)}
function pp(id){const p=gp(id);view=()=>pp(id);const rm=p.b-p.sp;
let h=`<button class="b" onclick="go(hub)">←</button><h2>${p.ty=='s'?'📺':'🎬'} ${esc(p.ti)}${p.ty=='s'?' — Saison '+p.se:''}</h2><div class="r">${poster(p,150)}<div>État : <b>${ST[p.sg]}</b><br>Genre : ${p.gn} · ${p.eps?(p.ty=='s'?p.eps.length+' épisodes, '+p.tot+' min':p.tot+' min'):''} · Thème : ${esc(p.th||'libre')}<br>Sortie prévue : <b>${D(p.rel)}</b><br>Fonds de production : ${E(rm)} / ${E(p.b)}<br>Buzz : ${Math.round(p.hype)}/100${p.bad?'<br>⚠️ Ce titre risque de faire des vagues…':''}${p.cl&&p.cl.length&&!p.sued?'<br>⚖️ Un risque juridique plane…':''}${p.sg=='out'?`<br>${p.ty=='s'?'Spectateurs':'Entrées'} : <b>${p.ent.toLocaleString('fr-FR')}</b><br>Recettes : ${E(p.rev)}${p.rate?'<br>Presse : '+p.rate+'/5':''}${p.plat?'<br>Plateforme : '+p.plat+' ('+E(p.sold)+')':''}`:''}</div></div>`;
if(p.sg!='out')h+=`<div class="c"><b>🖼️ Affiche</b> (autant d’essais que tu veux)<textarea id="de" rows="3">${esc(p.desc)}</textarea><button class="b" onclick="gen(${id})">Générer l’affiche</button></div>`;

if(p.sg!='out')h+=`<div class="c"><b>📣 Promotion</b><br>`+PR.map((x,i)=>`<button class="b" onclick="pr(${id},${i})">${x[0]} · ${E(x[1])}</button>`).join('')+`<br><button class="b" onclick="calP(${id})">📅 Calendrier</button></div>`;

return()=>P(`<h2>🎬 Scène ${p.done+1}/${p.nd||3} — « ${esc(p.ti)} »</h2><p class="m">Avec ${esc(p.cast.n)}. Prépare ta scène : chaque choix change le film.</p><div class="c"><label>Lieu<select id="dl">${opt(LIEU.map(x=>x[0]))}</select></label><label>Météo / ambiance<select id="dm">${MET.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Cadrage<select id="dc">${CAD.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Nombre de prises (15 k€ chacune)<input id="dk" type="number" min="1" max="5" value="2"></label><label>Direction d’acteurs<select id="dd"><option>Laisser jouer</option><option>Plus intense</option><option>Plus doux</option></select></label><button class="b" onclick="scn(${p.id})">🎬 Action !</button></div>`)};
function scn(id){const p=gp(id),l=LIEU[+$('#dl').value],m=$('#dm').value,c=$('#dc').value,k=cl(+$('#dk').value||1,1,5),d=$('#dd').value;let q=l[3],cost=l[2]+k*15e3;
if((AF[p.gn]||[]).includes(m))q+=2;if(c.startsWith('Travelling')){q+=2;cost+=3e4}else if(c.startsWith('Plan-s'))q+=R()<.4?5:-3;else q+=1;q+=Math.min(3,k-1)-(k>4?1:0);
if(d=='Plus intense'){q+=2;p.mood=cl((p.mood??60)-2,0,100)}else if(d=='Plus doux')p.mood=cl((p.mood??60)+2,0,100);
p.q+=q;S.st-=cost;(p.sc=p.sc||[]).push({loc:l[1],met:m,cad:c.split(' (')[0],tk:k});L(`Scène tournée (${l[0].split(' (')[0]}, ${m.toLowerCase()}, ${c.split(' (')[0].toLowerCase()}, ${k} prise${k>1?'s':''}).`);sfx('clap');dp(id,1)}
const gs8=genSc;genSc=function(o){const a=gs8(o);if(o.sc&&o.sc.length)a.forEach((s,i)=>{const c=o.sc[i%o.sc.length];s.loc=c.loc;s.night=c.met=='Nuit';s.cad=c.cad;s.met=c.met});return a};
const fr8=frame;frame=function(o,sc,i){let h=fr8(o,sc,i);if(sc.cad=='Gros plan')h=h.replace('viewBox="0 0 320 180"','viewBox="50 40 220 124"');if(sc.met=='Pluie')h=h.replace('</svg>','<g stroke="#bfe3ff" opacity=".5">'+Array.from({length:26},(_,k)=>`<line x1="${k*13}" y1="${(k*37)%150}" x2="${k*13-6}" y2="${(k*37)%150+16}"/>`).join('')+'</g></svg>');if(sc.met=='Brouillard')h=h.replace('</svg>','<rect width="320" height="180" fill="#fff" opacity=".28"/></svg>');return h};
wp=function(id){const p=gp(id);if(p.ty=='s')return epl(id);scr({ti:p.ti,gn:p.gn,th:p.th,sy:p.sy,ch:p.ch||(p.cast?p.cast.n:''),dur:p.dur||110,qf:p.qf,sc:p.sc,back:`pp(${id})`})};
wep=function(id,i){const p=gp(id),e=(p.eps&&p.eps[i])||{t:'Épisode 1',d:50};scr({ti:p.ti+' — '+e.t,gn:p.gn,th:p.th,sy:p.sy,ch:p.ch||(p.cast?p.cast.n:''),dur:e.d,qf:p.qf,sc:p.sc,back:`epl(${id})`})};
DI.push(['Un figurant filme le plateau et poste une vidéo.',[['Exiger la suppression',{d:1}],['Laisser faire (buzz gratuit)',{q:1}]]],['Le camion de matériel est bloqué sur l’autoroute.',[['Louer du matériel sur place (90 k€)',{c:9e4}],['Attendre demain',{d:1,q:-1}]]],['L’actrice ou l’acteur principal a de la fièvre.',[['Arrêter 2 jours',{d:2}],['Tourner quand même',{q:-4}]]],['Le drone de prise de vue tombe en panne.',[['Réparer (40 k€)',{c:4e4,q:1}],['Se passer de plans aériens',{q:-2}]]],['Une scène que tu aimes ne marche pas à l’écran.',[['La réécrire sur place',{q:3,d:1}],['La couper',{q:-1}]]],['Un voisin porte plainte pour le bruit.',[['Le dédommager (30 k€)',{c:3e4}],['Tourner la nuit',{q:-1}]]]);
ANG.push('une saison de la dernière chance après une annulation','un film-hommage réalisé comme une lettre d’amour aux fans','un récit parallèle jamais raconté jusque-là');TW.push('Le studio exige un casting très médiatique.','Une partie du tournage doit se faire à l’étranger.','Les premières images ont déjà fuité.');

/* vie d'acteur : scènes, énergie, agent, rivalités */
SC.push(['On te demande de pleurer en un seul plan.',[['Chercher un souvenir douloureux',()=>R()<.6?['Les larmes coulent, la scène est bouleversante.',9,2]:['Rien ne vient, la prise est ratée.',-4,0]],['Te servir de la technique',()=>['Propre, mais un peu froid.',3,0]]]],
['Une scène de combat est mal chorégraphiée.',[['Corriger avec le coordinateur',()=>['Plus sûr et plus lisible.',4,1]],['Te lancer à fond',()=>R()<.5?['Impressionnant !',8,2]:['Un coup mal placé : arrêt de tournage.',-5,-1]]]],
['Le réalisateur change le texte la veille.',[['T’adapter sans râler',()=>['Tu impressionnes l’équipe.',4,2]],['Protester',()=>['Il accepte… en soupirant.',-1,-2]]]],
['Un fan s’est glissé sur le plateau.',[['Prendre une photo avec lui',()=>['Il poste tout. Petit buzz.',1,1,1]],['Appeler la sécurité',()=>['Efficace, mais froid.',0,0]]]],
['Ton partenaire de jeu est incroyable.',[['Chercher l’alchimie',()=>R()<.65?['Vous créez une vraie magie à l’écran.',9,2]:['Trop de retenue, ça ne prend pas.',1,0]],['Rester sur ton jeu',()=>['Solide, sans plus.',3,0]]]]);
const LF=[[`Un tabloïd affirme que tu as des tensions sur ton dernier plateau.`,[['Démentir publiquement',()=>R()<.7?(S.rep+=1,fol(500),'Le démenti fait taire la rumeur.'):(S.rep-=2,'Ton démenti est tourné en dérision.')],['Ignorer',()=>(S.rep-=1,'La rumeur s’essouffle, en laissant des traces.')],['En rire sur les réseaux',()=>(fol(3000),'Ton humour désamorce tout. Bien joué.')]]],
['Une vieille vidéo de toi ressurgit en ligne.',[['T’excuser',()=>(S.rep-=1,S.fame=Math.max(0,S.fame-1),'Les excuses sont bien reçues.')],['Assumer',()=>(S.rep-=3,fol(8000),'Tu divises, mais tout le monde parle de toi.')],['Prendre un avocat (5 k€)',()=>(S.cash-=5e3,'La vidéo disparaît discrètement.')]]],
['Tu rencontres quelqu’un lors d’une soirée.',[['Te laisser aller',()=>(S.en=cl((S.en??80)+10,0,100),S.love=1,'Une belle histoire commence. Ça fait du bien.')],['Rester concentré·e sur ta carrière',()=>(S.fame=Math.min(100,S.fame+.5),'Tu avances, un peu seul·e.')]]],
['Un acteur concurrent se moque de toi à la télévision.',[['Répliquer en direct',()=>R()<.5?(fol(4000),S.rep+=1,'Ta réplique fait le tour des réseaux.'):(S.rep-=2,'Ça tourne mal : tu passes pour un mauvais perdant.')],['Ignorer',()=>'Tu gardes ton calme.'],['Le défier sur un projet commun',()=>(S.fame=Math.min(100,S.fame+1),S.en=cl((S.en??80)-10,0,100),'Le public attend ce duel avec impatience.')]]],
['Un proche traverse une période difficile.',[['L’aider financièrement (20 % de ton compte)',()=>(S.cash-=Math.round(S.cash*.2),S.rep+=1,'Tu es là pour lui. Ça compte.')],['Lui envoyer un message',()=>'Un geste simple, apprécié.']]]],
FT=['Tu es épuisé·e : le corps lâche.',[['Prendre deux semaines de repos',()=>(S.en=cl((S.en??80)+40,0,100),'Tu repars à neuf.')],['Continuer quand même',()=>(S.en=cl((S.en??80)-15,0,100),S.rep-=1,'Tu tiens, mais à quel prix…')]]];
H.life=e=>{S.en=cl((S.en??80)+8,0,100);Q.push({t:S.t+rn(18,30),k:'life'});if(S.en<=5){S.rep=Math.max(0,S.rep-4);S.en=50;L('🔥 Burn-out : tu dois t’arrêter un temps (réputation -4).');return}
const ev=S.en<30?FT:pk(LF);return()=>P(`<h2>🌆 Hors plateau</h2><div class="c">${ev[0]}</div>`+ev[1].map((c,j)=>`<button class="b" onclick="lfA(${LF.indexOf(ev)},${j})">${c[0]}</button>`).join(''))};
function lfA(i,j){const ev=i<0?FT:LF[i],t=ev[1][j][1]();S.rep=cl(S.rep,0,100);L('🌆 '+t);P(`<div class="c">${t}</div><button class="b" onclick="go(hub)">Continuer</button>`)}
const sa8=H.shootA;H.shootA=e=>{const r=sa8(e),x=S.roles.find(q=>q.id==e.id);S.en=cl((S.en??80)-10,0,100);if(S.agent&&x&&x.pay)S.cash-=Math.round(x.pay*.1);return r};
function rest(){S.en=cl((S.en??80)+25,0,100);L('😴 Une semaine de repos.');adv(7)?view():go(hub)}
function ag(){busy=true;P(`<h2>🤵 Ton agent</h2>`+(S.agent?`<div class="c">Ton agent te prend 10 % de tes cachets, améliore tes chances aux castings et te propose parfois des rôles directement${S.fame>=60?', même chez les grands studios':''}.</div>`:`<div class="c">Un agent prend 10 % de tes cachets mais booste tes castings et t’apporte des offres directes.<br>${S.fame>=12?'Tu peux en recruter un.':'Il faut une célébrité d’au moins 12.'}</div>${S.fame>=12?'<button class="b" onclick="S.agent=1;L(\'🤵 Tu signes avec un agent.\');ag()">✍️ Signer avec un agent</button>':''}`)+`<button class="b" onclick="go(hub)">←</button>`)}
H.agoff=e=>{if(!S.agent)return;const d=S.adone=S.adone||[],big=S.fame>=60&&R()<.5?pk(BG.filter(b=>!d.includes(b[1]))):null,i=big?6:cl(TI.map((x,k)=>k).filter(k=>TI[k][1]<=S.fame+10).pop(),0,6),t=big?big[1]:pk(TP),pay=rn(...TI[i][2]);
return()=>P(`<h2>🤵 Ton agent appelle</h2><div class="c">${big?big[0]+' te propose un rôle dans':'Une production te propose un rôle dans'} « ${esc(t)} » (${TI[i][0]}). Cachet : <b>${E(pay)}</b>.</div><button class="b" onclick="agA(${i},'${esc(t).replace(/'/g,'’')}',${big?1:0})">✅ Accepter</button><button class="b" onclick="go(hub)">❌ Refuser</button>`)};
function agA(i,t,b){const r={id:++S.u,t,i,perf:0};S.roles.push(r);if(b)(S.adone=S.adone||[]).push(t);Q.push({t:S.t+rn(10,20),k:'shootA',id:r.id},{t:S.t+rn(90,150),k:'relA',id:r.id});L(`🤵 Rôle obtenu via ton agent : « ${t} ».`);go(hub)}

const bx8=H.box;H.box=e=>{const p=gp(e.id);S.cmp=(S.cmp||[]).filter(c=>c.until>S.t);const f=1-Math.min(.35,S.cmp.reduce((a,c)=>a+c.pw,0)/400),E0=p.E;p.E=E0*f;const r=bx8(e);p.E=E0;if(f<.9)L(`Concurrence en salles : -${Math.round((1-f)*100)} % d’entrées cette semaine.`);return r};
const rd8=H.rand;H.rand=e=>{rd8(e);if(!Q.some(x=>x.k=='life'))Q.push({t:S.t+rn(15,25),k:'life'});if(!Q.some(x=>x.k=='rrel'))Q.push({t:S.t+rn(10,25),k:'rrel'});if(S.agent&&!Q.some(x=>x.k=='agoff'))Q.push({t:S.t+rn(25,50),k:'agoff'})};
const hub8=hub;hub=function(){hub8();const m=$('#m'),a=S.mode!='d';if(m.innerHTML){m.innerHTML=m.innerHTML.replace('Abonnés<b>','Abonnés<b>').replace(/(<div>👥 Abonnés<b>[^<]*<\/b><\/div>)/,`$1<div>⚡ Énergie<b>${Math.round(S.en??80)}</b></div>`)}const g=document.querySelector('.tl2');if(g)g.insertAdjacentHTML('beforeend',`<button onclick="rest()"><span>😴</span>Se reposer</button>${a?'<button onclick="ag()"><span>🤵</span>Agent</button>':''}`)};

/* sons */
let AX=null,SFX=true;if(document.addEventListener)document.addEventListener('click',()=>{if(!AX)try{AX=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}});
function sfx(k){if(!AX||!SFX)return;try{const n=AX.sampleRate,du=k=='app'?3:.18,b=AX.createBuffer(1,Math.floor(n*du),n),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(k=='app'?Math.pow(1-i/d.length,1.5)*(.5+.5*Math.sin(i/900)):Math.exp(-i/(n*.03)));const s=AX.createBufferSource(),g=AX.createGain(),f=AX.createBiquadFilter();f.type='bandpass';f.frequency.value=k=='app'?2500:1800;g.gain.value=k=='app'?.18:.35;s.buffer=b;s.connect(f);f.connect(g);g.connect(AX.destination);s.start()}catch(e){}}

menu();
